[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmpic"
version = "0.3.0"
description = "LLM-powered chart generation Python SDK — create charts with natural language"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "ADW-19"}
]
keywords = ["chart", "plot", "matplotlib", "llm", "data-visualization", "natural-language", "jupyter", "openai", "deepseek"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",

    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "openai>=1.0",
    "pandas>=2.0",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "cartopy>=0.22",
]

[project.optional-dependencies]
full = [
    "pandas>=2.0",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.urls]
Repository = "https://github.com/ADW-19/llmpic"

[tool.setuptools.packages.find]
where = ["src"]